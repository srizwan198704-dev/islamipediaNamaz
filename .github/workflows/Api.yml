name: Automated Global Prayer Times API

on:
  schedule:
    # প্রতিদিন সন্ধ্যা ৬টা বাংলাদেশ সময় (UTC 12:00 PM)
    - cron: '0 12 * * *'
    # প্রতিদিন রাত ১২টা বাংলাদেশ সময় (UTC 6:00 PM)
    - cron: '0 18 * * *'
  workflow_dispatch:

# গিটহাব অ্যাকশনকে ফাইলে রাইট করার পারমিশন দেওয়ার জন্য এই ৩টি লাইন যুক্ত করুন
permissions:
  contents: write

jobs:
  scrape-and-commit:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Initialize Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Run Global API Engine
      run: python scraper.py

    - name: Push Beautiful API Structure to GitHub
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action API Bot"
        git add .
        git diff --quiet && git diff --staged --quiet || (git commit -m "Automated API Synchronization: $(date +'%Y-%m-%d %H:%M:%S')" && git push)
